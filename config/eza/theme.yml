# Minimal shared base — all per-machine colours live in EZA_COLORS (tools.zsh).
# Only file_type and the two filekinds without EZA_COLORS equivalents remain here.
# Reference: https://github.com/eza-community/eza/blob/main/man/eza_colors-explanation.5.md

colourful: true

filekinds:
  mount_point:  { foreground: "#0891b2", is_bold: true }
  special:      { foreground: "#9333ea" }

file_type:
  image:      { foreground: "#db2777" }
  video:      { foreground: "#9333ea" }
  music:      { foreground: "#0891b2" }
  lossless:   { foreground: "#0891b2" }
  crypto:     { foreground: "#dc2626" }
  document:   { foreground: "#689d6a" }
  compressed: { foreground: "#ea580c" }
  temp:       { foreground: "#9ca3af", is_dimmed: true }
  compiled:   { foreground: "#d97706" }
  build:      { foreground: "#16a34a" }
