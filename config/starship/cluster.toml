# ── Starship config — cluster (purple) ───────────────────────────────────────

"$schema" = 'https://starship.rs/config-schema.json'

add_newline = true
palette     = "gruvbox_cluster"

format = """
[](color_orange)\
$os\
$username\
[](bg:color_yellow fg:color_orange)\
$directory\
[](fg:color_yellow bg:color_aqua)\
$git_branch\
$git_status\
[](fg:color_aqua bg:color_blue)\
$c\
$cpp\
$rust\
$golang\
$nodejs\
$php\
$java\
$kotlin\
$haskell\
$python\
$julia\
[](fg:color_blue bg:color_bg3)\
$docker_context\
$conda\
$pixi\
$cmd_duration\
$status\
$fill\
[](fg:color_bg3 bg:color_bg1)\
$time\
[ ](fg:color_bg1)\
$line_break$character"""

[palettes.gruvbox_cluster]
color_fg0    = '#ede9fe'   # violet-100  — light lavender text
color_bg1    = '#0d0618'   # near-black  — time bg
color_bg3    = '#200c4a'   # dark purple — tool context bg
color_blue   = '#5b21b6'   # violet-800  — language section bg
color_aqua   = '#6d28d9'   # violet-700  — git section bg
color_green  = '#a78bfa'   # violet-400  — success symbol
color_orange = '#2d1569'   # deep indigo — OS section bg
color_purple = '#c4b5fd'   # violet-300  — vimcmd symbols
color_red    = '#f87171'   # red-400     — error
color_yellow = '#7c3aed'   # violet-600  — directory bg

[os]
disabled = false
style    = "bg:color_orange fg:color_fg0"

[os.symbols]
Windows          = "󰍲"
Ubuntu           = "󰕈"
SUSE             = ""
Raspbian         = "󰐿"
Mint             = "󰣭"
Macos            = "󰀵"
Manjaro          = ""
Linux            = "󰌽"
Gentoo           = "󰣨"
Fedora           = "󰣛"
Alpine           = ""
Amazon           = ""
Android          = ""
AOSC             = ""
Arch             = "󰣇"
Artix            = "󰣇"
EndeavourOS      = ""
CentOS           = ""
Debian           = "󰣚"
Redhat           = "󱄛"
RedHatEnterprise = "󱄛"
Pop              = ""

[username]
show_always = true
style_user  = "bg:color_orange fg:color_fg0"
style_root  = "bg:color_orange fg:color_fg0"
format      = '[ $user ]($style)'

[directory]
style             = "fg:color_fg0 bg:color_yellow"
format            = "[ $path ]($style)"
truncation_length = 4
truncation_symbol = "…/"
truncate_to_repo  = true
read_only         = " 󰌾"
read_only_style   = "bold fg:color_fg0 bg:color_red"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music"     = "󰝚 "
"Pictures"  = " "
"Developer" = "󰲋 "

[git_branch]
symbol = ""
style  = "bg:color_aqua"
format = '[[ $symbol $branch ](fg:color_fg0 bg:color_aqua)]($style)'

[git_status]
style     = "bg:color_aqua"
format    = '[[($all_status$ahead_behind )](fg:color_fg0 bg:color_aqua)]($style)'
ahead     = "⇡${count}"
behind    = "⇣${count}"
diverged  = "⇕⇡${ahead_count}⇣${behind_count}"
staged    = "+${count}"
modified  = "!${count}"
untracked = "?${count}"
deleted   = "-${count}"
stashed   = "≡"

[nodejs]
symbol = ""
style  = "bg:color_blue"
format = '[[ $symbol( $version) ](fg:color_fg0 bg:color_blue)]($style)'

[c]
symbol = " "
style  = "bg:color_blue"
format = '[[ $symbol( $version) ](fg:color_fg0 bg:color_blue)]($style)'

[cpp]
symbol = " "
style  = "bg:color_blue"
format = '[[ $symbol( $version) ](fg:color_fg0 bg:color_blue)]($style)'

[rust]
symbol = ""
style  = "bg:color_blue"
format = '[[ $symbol( $version) ](fg:color_fg0 bg:color_blue)]($style)'

[golang]
symbol = ""
style  = "bg:color_blue"
format = '[[ $symbol( $version) ](fg:color_fg0 bg:color_blue)]($style)'

[php]
symbol = ""
style  = "bg:color_blue"
format = '[[ $symbol( $version) ](fg:color_fg0 bg:color_blue)]($style)'

[java]
symbol = ""
style  = "bg:color_blue"
format = '[[ $symbol( $version) ](fg:color_fg0 bg:color_blue)]($style)'

[kotlin]
symbol = ""
style  = "bg:color_blue"
format = '[[ $symbol( $version) ](fg:color_fg0 bg:color_blue)]($style)'

[haskell]
symbol = ""
style  = "bg:color_blue"
format = '[[ $symbol( $version) ](fg:color_fg0 bg:color_blue)]($style)'

[python]
symbol            = ""
style             = "bg:color_blue"
format            = '[[ $symbol( $version) ](fg:color_fg0 bg:color_blue)]($style)'
detect_extensions = ["py"]
detect_files      = ["pyproject.toml", "requirements.txt", ".python-version"]
detect_folders    = [".venv", "venv"]

[julia]
symbol   = ""
style    = "bg:color_blue"
format   = '[[ $symbol( $version) ](fg:color_fg0 bg:color_blue)]($style)'
disabled = false

[docker_context]
symbol = ""
style  = "bg:color_bg3"
format = '[[ $symbol( $context) ](fg:#83a598 bg:color_bg3)]($style)'

[conda]
style  = "bg:color_bg3"
format = '[[ $symbol( $environment) ](fg:#83a598 bg:color_bg3)]($style)'

[pixi]
style  = "bg:color_bg3"
format = '[[ $symbol( $version)( $environment) ](fg:color_fg0 bg:color_bg3)]($style)'

[cmd_duration]
min_time          = 2_000
style             = "bg:color_bg3"
format            = '[[ 󱎫 $duration ](fg:color_yellow bg:color_bg3)]($style)'
show_milliseconds = false

[status]
disabled = false
style    = "bg:color_bg3"
format   = '[[ ✗ $status ](fg:#fb4934 bg:color_bg3 bold)]($style)'

[fill]
symbol = " "
style  = "bg:color_bg3"

[time]
disabled    = false
time_format = "%H:%M:%S"
use_12hr    = false
style       = "bg:color_bg1"
format      = '[[  $time ](fg:color_fg0 bg:color_bg1)]($style)'

[line_break]
disabled = false

[character]
disabled                  = false
success_symbol            = '[](bold fg:color_green)'
error_symbol              = '[](bold fg:color_red)'
vimcmd_symbol             = '[](bold fg:color_green)'
vimcmd_replace_one_symbol = '[](bold fg:color_purple)'
vimcmd_replace_symbol     = '[](bold fg:color_purple)'
vimcmd_visual_symbol      = '[](bold fg:color_yellow)'
